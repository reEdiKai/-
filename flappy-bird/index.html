<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flappy Bird 小遊戲</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <h1>Flappy Bird</h1>
      <p class="hint">按空白鍵或點擊畫面開始飛行，避免撞到水管！</p>
      <canvas id="game" width="420" height="640" aria-label="Flappy Bird 遊戲畫面"></canvas>
      <section class="hud">
        <p>分數：<span id="score">0</span></p>
        <p>最高分：<span id="best">0</span></p>
        <button id="restart" type="button">重新開始</button>
      </section>
    </main>

    <script src="game.js"></script>
  </body>
</html>
